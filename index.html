<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HMI Trainer">
  <meta name="theme-color" content="#1f1f1f">
  <title>HMI Training Simulator v0.6</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="hmiViewport" class="hmi-viewport">
  <div id="hmiShell" class="hmi-shell">
    <header class="topbar">
      <div class="machine-id">TRAINCELL---B1S1---KF01</div>
      <div id="screenTitle" class="screen-title">Grundbild 010</div>
      <div class="status-area">
        <div>TR/01</div>
        <div id="dateText"></div>
        <div id="timeText"></div>
        <span>Simul.</span>
        <div class="status-light"></div>
      </div>
    </header>

    <main id="screenHost"></main>

    <section class="alarm-strip">
      <button class="indications" data-nav="alarms">Indica-<br>tions</button>
      <div class="alarm-table">
        <div class="alarm-head">
          <span>Time</span><span>Date</span><span>Status</span><span>Text</span>
        </div>
        <div class="alarm-row warning">
          <span id="alarmTime1">--</span><span id="alarmDate1">--</span><span>K</span>
          <span id="alarmText1">TRAINING: Robot not ready.</span>
        </div>
        <div class="alarm-row warning">
          <span id="alarmTime2">--</span><span id="alarmDate2">--</span><span>K</span>
          <span>TRAINING: Lubrication level low.</span>
        </div>
      </div>
      <button id="ackBtn" class="hmi-btn">Ackn.</button>
    </section>

    <footer class="footer-nav">
      <div class="cell-tabs">
        <button class="hmi-btn small" data-action="station-prev">&lt;&lt;</button>
        <button class="hmi-btn cell active-yellow" data-action="station" data-station="115000 UQ1">115000<br>UQ1</button>
        <button class="hmi-btn cell" data-action="station" data-station="115020 V01">115020<br>V01</button>
        <button class="hmi-btn cell" data-action="station" data-station="115040 UQ1">115040<br>UQ1</button>
        <button class="hmi-btn cell" data-action="station" data-station="115050 UQ1">115050<br>UQ1</button>
        <button class="hmi-btn cell" data-action="station" data-station="115070 V01">115070<br>V01</button>
        <button class="hmi-btn cell" data-action="station" data-station="115085 SF1">115085<br>SF1</button>
        <button class="hmi-btn cell" data-action="station" data-station="125090 UQ1">125090<br>UQ1</button>
        <button class="hmi-btn cell" data-action="station" data-station="135095 SF1">135095<br>SF1</button>
        <button class="hmi-btn cell" data-action="station" data-station="135100 V01">135100<br>V01</button>
        <button class="hmi-btn small" data-action="station-next">&gt;&gt;</button>
      </div>
      <div class="global-tabs">
        <button class="hmi-btn yellow" data-nav="process">Process<br>devices</button>
        <button class="hmi-btn red" data-nav="robot">Robot</button>
        <button class="hmi-btn" data-nav="plant">plant</button>
        <button class="hmi-btn yellow" data-nav="main">Main<br>view</button>
      </div>
    </footer>
  </div>

  <template id="screen-main">
    <section class="screen main-screen">
      <aside class="vertical-label">TRAINCELL</aside>
      <div class="main-grid">
        <div class="menu-col">
          <div class="section-title">general</div>
          <button class="hmi-btn" data-nav="preselection">Preselections</button>
          <button class="hmi-btn" data-nav="operating">Operating modes</button>
          <button class="hmi-btn yellow" data-nav="statistics">Statistics</button>
          <button class="hmi-btn" data-nav="plant">plant</button>
          <button class="hmi-btn" data-nav="diagnostics">diagnostic</button>
          <button class="hmi-btn" data-nav="sequencers">Sequencers</button>
          <button class="hmi-btn" data-nav="applications">Applications</button>
          <button class="hmi-btn" data-nav="administration">Administration</button>
        </div>

        <div class="menu-col">
          <div class="section-title">Robot</div>
          <button class="hmi-btn red" data-nav="robot">Robot</button>
          <button class="hmi-btn" data-nav="process">Process devices</button>
          <div class="section-title mini">plants</div>
          <button class="hmi-btn" data-nav="global">Global states</button>
          <div class="spacer"></div>
          <button class="hmi-btn" data-nav="maintenance">Maintenance cell</button>
        </div>

        <div class="technology-panel">
          <div class="section-title">technologies</div>
          <div class="tech-stack">
            <button class="hmi-btn" data-action="tech" data-label="PLS microScan 115000BG11">PLS microScan<br>115000BG11</button>
            <button class="hmi-btn" data-action="tech" data-label="PLS microScan 135100BG11">PLS microScan<br>135100BG11</button>
          </div>
        </div>

        <div class="menu-col">
          <div class="section-title">interface</div>
          <button class="hmi-btn" data-nav="interface">Interface<br>ARG2</button>
        </div>
      </div>
    </section>
  </template>

  <template id="screen-plant">
    <section class="screen plant-screen">
      <button class="hmi-btn prev" data-nav="main">Previous<br>picture</button>
      <button class="hmi-btn plant-type-btn" data-nav="planttype">Plant Type</button>
      <svg class="plant-svg" viewBox="0 0 1200 620">
        <rect width="1200" height="620" fill="#bdbdbd"/>
        <path class="line" d="M90 120 H1110 M120 120 V500 H1060 V120"/>
        <path class="line" d="M350 120 V500 M690 120 V500"/>
        <circle class="zone" cx="265" cy="290" r="55"/>
        <circle class="zone" cx="565" cy="290" r="55"/>
        <circle class="zone" cx="920" cy="290" r="55"/>

        <g class="robot-icon" data-device="Robot 115010R01" transform="translate(185 240)">
          <circle r="30" class="robot-yellow"/>
          <path d="M-12 12 L0 -10 L13 -24 M0 -10 L17 -3 M13 -24 L27 -35" class="robot-arm"/>
          <rect x="-44" y="38" width="88" height="28" class="tag-red"/>
          <text y="57">115010R01</text>
        </g>

        <g class="robot-icon" data-device="Robot 115070R02" transform="translate(475 340)">
          <circle r="30" class="robot-green"/>
          <path d="M-12 12 L0 -10 L13 -24 M0 -10 L17 -3 M13 -24 L27 -35" class="robot-arm green-arm"/>
          <rect x="-44" y="38" width="88" height="28" class="tag-yellow"/>
          <text y="57">115070R02</text>
        </g>

        <g class="robot-icon" data-device="Robot 135110R01" transform="translate(850 245)">
          <circle r="30" class="robot-yellow"/>
          <path d="M-12 12 L0 -10 L13 -24 M0 -10 L17 -3 M13 -24 L27 -35" class="robot-arm"/>
          <rect x="-44" y="38" width="88" height="28" class="tag-yellow"/>
          <text y="57">135110R01</text>
        </g>

        <g class="robot-icon" data-device="Robot 115020R01" transform="translate(240 390)"><circle r="22" class="robot-yellow"/><path d="M-8 8 L0 -8 L10 -18 M0 -8 L14 -2" class="robot-arm"/><rect x="-38" y="29" width="76" height="22" class="tag-yellow"/><text y="43">115020R01</text></g>
        <g class="robot-icon" data-device="Robot 115060R01" transform="translate(410 250)"><circle r="22" class="robot-yellow"/><path d="M-8 8 L0 -8 L10 -18 M0 -8 L14 -2" class="robot-arm"/><rect x="-38" y="29" width="76" height="22" class="tag-yellow"/><text y="43">115060R01</text></g>
        <g class="robot-icon" data-device="Robot 115070R01" transform="translate(590 390)"><circle r="22" class="robot-yellow"/><path d="M-8 8 L0 -8 L10 -18 M0 -8 L14 -2" class="robot-arm"/><rect x="-38" y="29" width="76" height="22" class="tag-yellow"/><text y="43">115070R01</text></g>
        <g class="robot-icon" data-device="Robot 135120R01" transform="translate(875 390)"><circle r="22" class="robot-yellow"/><path d="M-8 8 L0 -8 L10 -18 M0 -8 L14 -2" class="robot-arm"/><rect x="-38" y="29" width="76" height="22" class="tag-yellow"/><text y="43">135120R01</text></g>
        <g class="robot-icon" data-device="Robot 135130R01" transform="translate(1030 300)"><circle r="22" class="robot-yellow"/><path d="M-8 8 L0 -8 L10 -18 M0 -8 L14 -2" class="robot-arm"/><rect x="-38" y="29" width="76" height="22" class="tag-yellow"/><text y="43">135130R01</text></g>
        <g transform="translate(70 160)">
          <rect width="120" height="88" class="station-box"/>
          <text x="60" y="18">CELL 11</text>
          <rect x="12" y="28" width="78" height="22" class="tag-green"/>
          <text x="51" y="43">SAFE</text>
          <circle cx="102" cy="39" r="8" class="lamp-green"/>
          <rect x="12" y="56" width="78" height="22" class="tag-yellow"/>
          <text x="51" y="71">READY</text>
          <circle cx="102" cy="67" r="8" class="lamp-green"/>
        </g>

        <g transform="translate(1000 160)">
          <rect width="120" height="88" class="station-box"/>
          <text x="60" y="18">CELL 13</text>
          <rect x="12" y="28" width="78" height="22" class="tag-green"/>
          <text x="51" y="43">SAFE</text>
          <circle cx="102" cy="39" r="8" class="lamp-green"/>
          <rect x="12" y="56" width="78" height="22" class="tag-yellow"/>
          <text x="51" y="71">READY</text>
          <circle cx="102" cy="67" r="8" class="lamp-green"/>
        </g>
      </svg>
      <div id="deviceInfo" class="device-info">Select a robot/device.</div>
    </section>
  </template>

  <template id="screen-preselection">
    <section class="screen">
      <button class="hmi-btn prev" data-nav="main">Previous<br>picture</button>
      <div class="pre-grid">
        <div class="mode-panel" data-cell="11"></div>
        <div class="mode-panel" data-cell="12"></div>
        <div class="mode-panel" data-cell="13"></div>
      </div>
      <div class="media-strip">
        <div class="media-card"><button class="hmi-btn active-green" data-action="media-toggle" data-media="air11">Air</button><div><b>AirPressure 11</b><small>BP01E &nbsp; LP &nbsp; HP</small></div></div>
        <div class="media-card"><button class="hmi-btn active-green" data-action="media-toggle" data-media="cool11">On</button><div><b>CoolingWater 11</b><small>Supply ready</small></div></div>
        <div class="media-card"><button class="hmi-btn active-green" data-action="media-toggle" data-media="air13">Air</button><div><b>AirPressure 13</b><small>BP01E &nbsp; LP</small></div></div>
      </div>
      <div class="utility-grid">
        <div class="utility-card">
          <div class="section-title">ControlVoltage (K100)</div>
          <button id="controlVoltage" class="hmi-btn active-green">On</button>
        </div>
        <div class="utility-card">
          <div class="section-title">PROFI Energy Saving</div>
          <div class="segmented">
            <button class="hmi-btn">Without ES</button>
            <button class="hmi-btn active-green">With ES</button>
            <button class="hmi-btn active-green">Auto ES</button>
          </div>
        </div>
        <div class="utility-card">
          <div class="section-title">plant illumination</div>
          <div class="segmented">
            <button class="hmi-btn">On</button><button class="hmi-btn blue">Off</button><button class="hmi-btn">Perm. off</button><button class="hmi-btn">Perm. on</button>
          </div>
        </div>
        <div class="utility-card">
          <div class="section-title">Workstation illumination</div>
          <div class="segmented">
            <button class="hmi-btn blue">On</button><button class="hmi-btn">Off</button><button class="hmi-btn">Perm. off</button><button class="hmi-btn">Perm. on</button>
          </div>
        </div>
      </div>
    </section>
  </template>

  <template id="screen-operating">
    <section class="screen">
      <button class="hmi-btn prev" data-nav="main">Previous<br>picture</button>
      <aside class="vertical-label small">operating modes</aside>
      <div id="operatingRows" class="rows"></div>
    </section>
  </template>

  <template id="screen-statistics">
    <section class="screen">
      <button class="hmi-btn prev" data-nav="main">Previous<br>picture</button>
      <div class="stats-toolbar">
        <button class="hmi-btn">Cycle time</button>
        <button class="hmi-btn">Sequence list</button>
      </div>
      <div class="stats-grid">
        <div class="stats-card wide">
          <div class="section-title">1ARG</div>
          <table>
            <thead><tr><th></th><th>Qty.</th><th>Cycle time</th><th>Utilization</th><th>Availability</th><th>Tech. loss</th></tr></thead>
            <tbody>
              <tr><td>Actual</td><td>0</td><td>0.0</td><td>0.00</td><td>100.00</td><td>00:00:00</td></tr>
              <tr><td>Setpoint</td><td>366</td><td>60.0</td><td></td><td></td><td></td></tr>
              <tr><td>trend</td><td>312</td><td></td><td></td><td></td><td></td></tr>
            </tbody>
          </table>
        </div>
        <div class="stats-card">
          <div class="section-title">AirPressure 11</div>
          <button class="hmi-btn">Reset</button>
          <p>Min H2O: 0.00 Nm³</p>
          <p>Current: 0.00 Nm³</p>
        </div>
        <div class="stats-card">
          <div class="section-title">Energy 1KV1</div>
          <button class="hmi-btn">Reset</button>
          <p>0.000 kWh</p>
        </div>
      </div>
    </section>
  </template>

  <template id="screen-diagnostics">
    <section class="screen">
      <button class="hmi-btn prev" data-nav="main">Previous<br>picture</button>
      <div class="diag-left">
        <div class="section-title">PLC information</div>
        <table>
          <tr><th></th><th>PLC</th><th>HMI</th></tr>
          <tr><td>Date</td><td id="diagDate1"></td><td id="diagDate2"></td></tr>
          <tr><td>Time</td><td id="diagTime1"></td><td id="diagTime2"></td></tr>
        </table>
      </div>
      <div class="diag-right">
        <div class="section-title">plc-Info</div>
        <div class="diag-status"><span class="lamp gray"></span>STOP</div>
        <div class="diag-status"><span class="lamp green"></span>RUN</div>
        <div class="diag-status"><span class="lamp gray"></span>ERROR</div>
        <div class="diag-status"><span class="lamp green"></span>CONNECTION</div>
        <div class="diag-status"><span class="lamp green"></span>BUS</div>
        <div class="section-title mini">Communication Load</div>
        <p class="diag-metrics">min cycle time 8.5 ms<br>current cycle time 14.0 ms<br>max cycle time 62.3 ms</p>
      </div>
      <div class="diag-buttons">
        <button class="hmi-btn" data-nav="profinet">Profinet IO system</button>
        <button class="hmi-btn" data-nav="sysdiag">System diagnostics</button>
        <button class="hmi-btn" data-nav="topology">Topology Editor</button>
        <button class="hmi-btn" data-nav="snmp">Diagnosis SNMP</button>
      </div>
    </section>
  </template>

  <template id="screen-profinet">
    <section class="screen">
      <button class="hmi-btn prev" data-nav="diagnostics">Previous<br>picture</button>
      <button class="hmi-btn centered">Profinet IO system</button>
      <div id="profinetGrid" class="profinet-grid"></div>
    </section>
  </template>

  <template id="screen-sysdiag">
    <section class="screen">
      <button class="hmi-btn prev" data-nav="diagnostics">Previous<br>picture</button>
      <div class="alarm-toolbar">
        <button class="hmi-btn">Current alarms</button>
        <button class="hmi-btn">Alarm buffer</button>
        <input type="text" placeholder="SFM Alarm Filter">
        <button class="hmi-btn">Alarm log</button>
        <button class="hmi-btn">Archive Management</button>
      </div>
      <div class="large-table">
        <div class="table-head">Time &nbsp;&nbsp; Date &nbsp;&nbsp; Status &nbsp;&nbsp; Text</div>
        <div class="empty">No active system alarms in this training state.</div>
      </div>
    </section>
  </template>

  <template id="screen-sequencers">
    <section class="screen">
      <button class="hmi-btn prev" data-nav="main">Previous<br>picture</button>
      <div class="sequence-grid">
        <div class="sequence-card" data-id="115020V01"></div>
        <div class="sequence-card" data-id="135120V01"></div>
        <div class="sequence-card" data-id="115070V01"></div>
      </div>
    </section>
  </template>

  <template id="screen-robot">
    <section class="screen">
      <button class="hmi-btn prev" data-nav="main">Previous<br>picture</button>
      <aside class="vertical-label small">robot</aside>
      <div class="overview-tabs">
        <button class="hmi-btn active-yellow" data-action="robot-overview" data-page="1">Overview 1</button>
        <button class="hmi-btn" data-action="robot-overview" data-page="2">Overview 2</button>
        <button class="hmi-btn" data-action="robot-overview" data-page="3">Overview 3</button>
        <button class="hmi-btn" data-action="robot-ack">Ack. W/ Kickout</button>
        <button class="hmi-btn" data-action="robot-correction">Robot correction</button>
        <button class="hmi-btn" data-action="robot-archive">Archive robot</button>
      </div>
      <div id="robotRows" class="rows"></div>
      <div class="bottom-control-row">
        <button class="hmi-btn yellow">All</button>
        <button class="hmi-btn">Without Robot</button>
        <button class="hmi-btn">Stop</button>
        <button class="hmi-btn">Maintenance</button>
      </div>
    </section>
  </template>

  <template id="screen-process">
    <section class="screen">
      <button class="hmi-btn prev" data-nav="main">Previous<br>picture</button>
      <aside class="vertical-label small">process devices</aside>
      <div class="overview-tabs">
        <button class="hmi-btn active-yellow" data-action="process-overview" data-page="1">Overview 1</button>
        <button class="hmi-btn" data-action="process-overview" data-page="2">Overview 2</button>
        <button class="hmi-btn" data-action="process-overview" data-page="3">Overview 3</button>
        <button class="hmi-btn" data-action="process-overview" data-page="4">Overview 4</button>
        <button class="hmi-btn" data-action="process-overview" data-page="5">Overview 5</button>
        <button class="hmi-btn" data-action="process-overview" data-page="6">Overview 6</button>
        <button class="hmi-btn" data-action="process-ack">Ack. W/ Kickout</button>
      </div>
      <div id="processRows" class="rows"></div>
      <div class="bottom-control-row">
        <button class="hmi-btn yellow">All</button>
        <button class="hmi-btn">Without Process</button>
        <button class="hmi-btn">PE1</button>
        <button class="hmi-btn">PE2</button>
        <button class="hmi-btn">milling</button>
        <button class="hmi-btn">Maintenance</button>
      </div>
    </section>
  </template>

  <template id="screen-global">
    <section class="screen">
      <button class="hmi-btn prev" data-nav="main">Previous<br>picture</button>
      <div id="globalGrid" class="global-grid"></div>
    </section>
  </template>

  <template id="screen-alarms">
    <section class="screen alarm-screen">
      <button class="hmi-btn prev" data-nav="main">Previous<br>picture</button>
      <div class="alarm-toolbar">
        <button class="hmi-btn active-yellow">Current alarms</button>
        <button class="hmi-btn">Alarm buffer</button>
        <input type="text" placeholder="ProDiag Alarm Filter">
        <button class="hmi-btn">Alarm log</button>
        <button class="hmi-btn">Archive Management</button>
      </div>
      <div id="alarmList" class="alarm-list"></div>
    </section>
  </template>

  <template id="screen-applications">
    <section class="screen">
      <button class="hmi-btn prev" data-nav="main">Previous<br>picture</button>
      <div class="section-title" style="width:240px">Applications</div>
      <div class="app-buttons">
        <button class="hmi-btn" data-action="launch-tia">TIA Portal</button>
        <button class="hmi-btn" data-action="launch-eplan">Eplan PDF</button>
      </div>
      <div class="training-panel" id="applicationsInfo">Select an application. External engineering software is simulated only.</div>
    </section>
  </template>

  <template id="screen-administration">
    <section class="screen">
      <button class="hmi-btn prev" data-nav="main">Previous<br>picture</button>
      <div class="section-title" style="width:240px">Administration</div>
      <div class="app-buttons bottomish">
        <button class="hmi-btn" data-action="end-wincc">end WinCC flexible</button>
        <button class="hmi-btn yellow" data-action="project-info">Project info</button>
        <button class="hmi-btn" data-action="clean-screen">Activate Clean screen</button>
      </div>
      <div class="training-panel" id="adminInfo">Training administration page. Machine-control functions remain simulated.</div>
    </section>
  </template>

  <template id="screen-topology">
    <section class="screen">
      <button class="hmi-btn prev" data-nav="diagnostics">Previous<br>picture</button>
      <div class="section-title">Topology Editor</div>
      <div class="topology-map" id="topologyMap"></div>
      <div class="training-panel compact" id="topologyInfo">Select a node to view simulated network status.</div>
    </section>
  </template>

  <template id="screen-snmp">
    <section class="screen">
      <button class="hmi-btn prev" data-nav="diagnostics">Previous<br>picture</button>
      <div class="section-title">Diagnosis SNMP</div>
      <div id="snmpGrid" class="snmp-grid"></div>
      <div class="snmp-controls">
        <button class="hmi-btn" data-action="snmp-prev">&lt;</button>
        <button class="hmi-btn" data-action="snmp-read">Read device</button>
        <button class="hmi-btn" data-action="snmp-reset">Reset Status</button>
        <button class="hmi-btn" data-action="snmp-next">&gt;</button>
      </div>
    </section>
  </template>



  <template id="screen-planttype">
    <section class="screen compact-screen">
      <button class="hmi-btn prev" data-nav="plant">Previous<br>picture</button>
      <div class="planttype-map">
        <div class="rail top"></div>
        <div class="planttype-station p115000"><b>115000</b><button class="type-box" data-action="type-item" data-label="115010R01">0 <span>Type Robot<br>115010R01</span></button></div>
        <div class="planttype-station p115050"><b>115050</b><button class="type-box" data-action="type-item" data-label="115040UQ1">0 <span>Type Station<br>115040UQ1</span></button><button class="type-box" data-action="type-item" data-label="115060R01">0 <span>Type Robot<br>115060R01</span></button></div>
        <button class="type-box mid a" data-action="type-item" data-label="115030R01">0 <span>Type Robot<br>115030R01</span></button>
        <button class="type-box mid b" data-action="type-item" data-label="115080R01">0 <span>Type Robot<br>115080R01</span></button>
        <button class="type-box low a" data-action="station-open" data-station="115020 V01">0 <span>Type Station<br>115020V01</span></button>
        <button class="type-box low b" data-action="station-open" data-station="115070 V01">0 <span>Type Station<br>115070V01</span></button>
        <button class="type-box center c1" data-action="station-open" data-station="125090 UQ1">0 <span>Type Station<br>125090UQ1</span></button>
        <button class="type-box center c2" data-action="station-open" data-station="125090 UQ2">0 <span>Type Station<br>125090UQ2</span></button>
        <button class="type-box right r1" data-action="type-item" data-label="135110R01">0 <span>Type Robot<br>135110R01</span></button>
        <button class="type-box right r2" data-action="type-item" data-label="135130R01">0 <span>Type Robot<br>135130R01</span></button>
        <button class="type-box right r3" data-action="station-open" data-station="135120 V01">0 <span>Type Station<br>135120V01</span></button>
        <div class="cell-number n11">11</div><div class="cell-number n12">12</div><div class="cell-number n13">13</div><div class="cell-number n21">21</div>
      </div>
    </section>
  </template>

  <template id="screen-station">
    <section class="screen compact-screen">
      <button class="hmi-btn prev" data-nav="plant">Previous<br>picture</button>
      <div class="station-toolbar">
        <button class="hmi-btn">Tool</button><button class="hmi-btn">E2</button><button class="hmi-btn">E7</button>
        <button class="hmi-btn" data-action="station-mode" data-mode="stop">Stop</button>
        <button class="hmi-btn active-green" data-action="station-mode" data-mode="manual">Manual</button>
        <button class="hmi-btn" data-action="station-mode" data-mode="single">Single mode</button>
        <button class="hmi-btn" data-action="station-mode" data-mode="automatic">Automatic</button>
        <button class="hmi-btn red" data-action="station-stop">Stop</button>
        <button class="hmi-btn" data-action="station-start">Start</button><button class="hmi-btn">K100</button>
      </div>
      <div class="station-badges"><span>Door for inner panel</span><span>Door for mirror reinf LH</span><span>Valve On</span></div>
      <div class="station-body">
        <div id="fixtureRows" class="fixture-rows"></div>
        <div class="station-sequence">
          <div id="stationName" class="station-name">115020V01</div>
          <div class="sequence-card station-seq-card">
            <div class="sequence-tools"><b id="stationSeqDb">"115020V01#AS_DB"</b><span>AUTO</span><button class="hmi-btn" data-action="station-seq-step">▶▶</button><button class="hmi-btn" data-action="station-viewer">▣</button></div>
            <div class="sequence-line">S 001 &nbsp;&nbsp; S_Init: Grundstellung</div>
            <div class="sequence-line active-seq" id="stationSeqLine">S 002 &nbsp;&nbsp; S_FRG1: Release robot Drop</div>
          </div>
          <div class="station-status-table" id="stationStatusTable"></div>
          <div class="station-actions"><button class="hmi-btn" data-action="fixture-view">Fixture view</button><button class="hmi-btn" data-action="station-viewer">Sequence viewer</button></div>
        </div>
      </div>
    </section>
  </template>

  <template id="screen-fixture">
    <section class="screen compact-screen">
      <button class="hmi-btn prev" data-nav="station">Previous<br>picture</button>
      <div class="fixture-canvas">
        <div class="fixture-machine">
          <div class="fixture-base"></div><div class="fixture-arm a1"></div><div class="fixture-arm a2"></div><div class="fixture-arm a3"></div><div class="fixture-arm a4"></div>
        </div>
        <button class="callout c1" data-action="fixture-sensor" data-sensor="MM11a">MM11a</button>
        <button class="callout c2" data-action="fixture-sensor" data-sensor="MM12b">MM12b</button>
        <button class="callout c3" data-action="fixture-sensor" data-sensor="BGT11a">BGT11a</button>
        <button class="callout c4" data-action="fixture-sensor" data-sensor="BGT12b">BGT12b</button>
        <button class="callout c5" data-action="fixture-sensor" data-sensor="MM14a">MM14a</button>
        <div id="fixtureInfo" class="fixture-info">Select a fixture sensor/actuator.</div>
      </div>
    </section>
  </template>

  <template id="screen-viewer">
    <section class="screen compact-screen viewer-screen">
      <button class="hmi-btn prev" data-nav="station">Previous<br>picture</button>
      <div class="viewer-wrap">
        <div class="viewer-left" id="viewerSteps"></div>
        <div class="viewer-right"><div id="viewerTransitionTitle" class="viewer-title">T1: Release robot Drop</div><div class="logic-rail"><span></span><b id="viewerLogic">AS_Frg1</b></div></div>
      </div>
    </section>
  </template>

  <template id="screen-interface">
    <section class="screen compact-screen interface-screen">
      <button class="hmi-btn prev" data-nav="main">Previous<br>picture</button>
      <button class="hmi-btn next-picture" data-action="interface-page">next<br>picture</button>
      <div class="interface-title"><span>K1TVOL1</span><b>&lt;&lt;&gt;</b><span>ARG2</span></div>
      <div class="interface-columns"><div><div class="section-title">inputs</div><div id="interfaceInputs" class="io-table"></div></div><div><div class="section-title">outputs</div><div id="interfaceOutputs" class="io-table"></div></div></div>
    </section>
  </template>

  <template id="screen-cycletime">
    <section class="screen compact-screen">
      <button class="hmi-btn prev" data-nav="statistics">Previous<br>picture</button>
      <div id="cycleGrid" class="cycle-grid"></div>
    </section>
  </template>

  <template id="screen-correction">
    <section class="screen compact-screen">
      <button class="hmi-btn prev" data-nav="robot">Previous<br>picture</button>
      <div class="correction-box"><div class="section-title">Stop to correct</div><div class="correction-head"><span>Sequence</span><span>Process point</span><span></span><span>Robot</span></div><div id="correctionRows"></div><button class="hmi-btn correction-close" data-nav="robot">Close</button></div>
    </section>
  </template>

  <template id="screen-maintenance">
    <section class="screen compact-screen">
      <button class="hmi-btn prev" data-nav="main">Previous<br>picture</button><aside class="vertical-label small">maintenance call</aside>
      <div id="maintenanceRows" class="maintenance-rows"></div>
    </section>
  </template>

  <div id="hmiToast" class="hmi-toast" aria-live="polite"></div>

  </div>
  </div>

  <div id="rotateHint" class="rotate-hint" aria-hidden="true">
    <strong>HMI TRAINING SIMULATOR</strong>
    <span>Rotate your phone sideways for the full operator-panel view.</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
